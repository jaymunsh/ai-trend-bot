name: AI trend digest

on:
  schedule:
    # 07:23 / 13:23 / 19:23 Asia/Seoul (UTC+9). Odd minutes: GitHub queues far more
    # jobs on :00 and :30, and a scheduled run that backs up long enough is dropped.
    - cron: "23 22 * * *"
    - cron: "23 4 * * *"
    - cron: "23 10 * * *"
    # Backups ~50 minutes later, because GitHub drops scheduled runs under load and
    # did so on 2026-08-04. No guard against double sends: sent.jsonl already excludes
    # anything delivered, so a backup after a successful run finds nothing and sends
    # nothing.
    - cron: "11 23 * * *"
    - cron: "11 5 * * *"
    - cron: "11 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-trend-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Backups fire ~50 min after each slot; skip if that slot already delivered.
        run: uv run ai-trend-bot run --send --limit 30 --min-gap-hours 3
      - name: Commit send log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent.jsonl
          git diff --staged --quiet || git commit -m "Record digest send $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
