name: AI trend digest

on:
  # The miniPC cron owns the schedule now: GitHub delayed every scheduled run by
  # 63 to 193 minutes and dropped some outright, so the briefing kept landing at
  # lunch instead of breakfast.
  #
  # This is the manual fallback for when the miniPC is down. It judges from the
  # data/sent.jsonl snapshot in the repository, which stopped updating at the
  # cutover, so it cannot see the miniPC's recent sends — press it knowing a
  # briefing may repeat.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-trend-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Manual fallback sends immediately; it does not wait for a regular slot.
        run: uv run ai-trend-bot run --send --limit 50 --min-gap-hours 3
      - name: Commit send log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent.jsonl
          if [ -d data/archive ]; then git add data/archive; fi
          git diff --staged --quiet || git commit -m "Record digest send $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
